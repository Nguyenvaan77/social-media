name: CI - Auth Service

on:
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

  pull_request:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_NAME: nguyenvanan77/auth-service

jobs:
  test:
    name: Test Auth Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache: true
          cache-dependency-path: auth-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  build-and-push:
    name: Build and Push Auth Service Image
    needs: test
    runs-on: ubuntu-latest

    # Không build/push khi workflow được kích hoạt bởi pull_request.
    if: github.event_name != 'pull_request'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GithubActionsCIAuth-Service
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
